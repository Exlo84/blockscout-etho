version: 3.9

services:
  frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_DOCKER_TAG:-latest}
    pull_policy: missing
    platform: linux/amd64
    restart: always
    container_name: frontend
    env_file:
      -  ../envs/common-frontend.env
    ports:
      - 3000:3000
    volumes:
      - ${FRONTEND_DIR:-../frontend}/public/assets/etho-logo.png:/app/public/assets/etho-logo.png:ro
      - ${FRONTEND_DIR:-../frontend}/public/assets/etho-icon.png:/app/public/assets/etho-icon.png:ro
      - ${FRONTEND_DIR:-../frontend}/public/assets/favicon:/app/public/assets/favicon:ro
    environment:
      - NEXT_PUBLIC_AD_BANNER_PROVIDER=none
